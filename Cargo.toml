[package]
name = "nevermore-fms"
version = "0.3.0"
authors = ["Edgar Allan Ohms 5276"]
edition = "2024"


[dependencies]
# Framework
tokio = { version = "1", features = ["full", "tracing"] }
tokio-util = "0.7.17"

# CLI
clap = { version = "4.5.47", features = ["derive", "env"] }
log = "0.4.27"
pretty_env_logger = "0.5.0"

# Database
diesel = { version = "2.3.5", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2", "serde_json"] }
diesel_migrations = "2.3.1"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
directories = "6.0.0"

# Utils
anyhow = "1.0.99"
async-trait = "0.1.89"
chrono = "0.4.41"
uuid = { version = "1.18.1", features = ["v4", "fast-rng"] }
cidr = "0.3.1"
poem = "3.1.12"
async-graphql = "7.0.17"
async-graphql-poem = "7.0.17"
console-subscriber = "0.5.0"
openidconnect = "4.0.1"
serde_json = "1.0.151"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
struct_excessive_bools = "allow"
unused_async = "warn"
unchecked_time_subtraction = "allow"
